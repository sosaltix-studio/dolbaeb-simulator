[target.x86_64-unknown-linux-musl]
image = "ghcr.io/cross-rs/x86_64-unknown-linux-musl:edge"
pre-build = [
    "apt-get update && apt-get install -y curl make gcc",
    "curl -sSL https://www.alsa-project.org/files/pub/lib/alsa-lib-1.2.10.tar.bz2 | tar -xj",
    "cd alsa-lib-1.2.10 && ./configure --enable-static --disable-shared --host=x86_64-linux-musl --prefix=/usr/x86_64-linux-musl CC=x86_64-linux-musl-gcc && make -j$(nproc) && make install",
    "rm -rf alsa-lib-1.2.10"
]

[target.x86_64-unknown-linux-musl.env]
passthrough = [
    "PKG_CONFIG_ALLOW_CROSS=1",
    "PKG_CONFIG_PATH=/usr/x86_64-linux-musl/lib/pkgconfig"
]
