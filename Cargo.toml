[package]
name = "dolbaeb-simulator"
version = "0.1.1"
edition = "2024"

[dependencies]
macroquad = { version = "0.4", features = ["audio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 3

[package.metadata.appimage]
assets = ["assets"]

[package.metadata.android]
assets = "assets/"
